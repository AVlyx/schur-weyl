[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schur-weyl"
version = "0.2.0"
description = "Tools from Schur-Weyl duality"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Anton Van Cleemput", email = "anton@vancleem.com" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/AVlyx/schur-weyl"

[tool.hatch.build.targets.wheel]
packages = ["src/schur_weyl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
